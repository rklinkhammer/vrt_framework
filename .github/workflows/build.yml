name: C++ qualification
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [dev, asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14 clang-19 libc++-19-dev libc++abi-19-dev
      - name: Configure GCC and libstdc++
        if: matrix.compiler == 'gcc'
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=g++-14
      - name: Configure Clang and libc++
        if: matrix.compiler == 'clang'
        run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=clang++-19 -DCMAKE_CXX_FLAGS=-stdlib=libc++
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.compiler }}-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/
